<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="x402-stellar: x402 payments on Stellar for Python: agents pay per request, FastAPI routes charge in USDC, and a built-in facilitator settles on Soroban. Plugs into the official x402 Python SDK.">
