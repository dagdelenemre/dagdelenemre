<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="nopanic — The resilience toolkit Python was missing: retry, circuit breaker, timeout, adaptive rate limit, bulkhead, hedging and fallback behind one decorator API. Sync and async, zero runtime deps.">
