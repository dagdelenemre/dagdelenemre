<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Emre Kadir Dagdelen (dagdelean) — operator file. I build for the web and I am training to break it.">
<defs>
<radialGradient id="vig" cx=".2" cy="0" r="1.1">
<stop offset="0" stop-color="#ff3b21" stop-opacity=".10"/>
<stop offset=".5" stop-color="#ff3b21" stop-opacity="0"/>
</radialGradient>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ece8de" stroke-width="1"/></pattern>
<clipPath id="clip"><rect width="1200" height="340"/></clipPath>
</defs>
<style>
@font-face{font-family:'f1';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'f2';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'f3';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'f4';src:url(data:font/woff2;base64,) format('woff2');}
.scan{opacity:.14;animation:scan 7s linear infinite}
@keyframes scan{0%{transform:translateX(-40px);opacity:0}10%{opacity:.16}90%{opacity:.16}100%{transform:translateX(40px);opacity:0}}
@media (prefers-reduced-motion: reduce){.scan{animation:none}}
</style>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="#0b0b0a"/>
<clipPath id="r"><rect width="1200" height="340" rx="18"/></clipPath>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="#0b0b0a"/>
<rect width="1200" height="340" fill="url(#vig)"/>
<rect width="1200" height="340" fill="url(#hatch)" opacity=".05"/>
<g clip-path="url(#clip)">
<line class="scan" x1="0" y1="70" x2="1200" y2="70" stroke="#ff3b21" stroke-width="1" style="animation-delay:0s"/>
<line class="scan" x1="0" y1="150" x2="1200" y2="150" stroke="#ff3b21" stroke-width="1" style="animation-delay:-3s"/>
<line class="scan" x1="0" y1="250" x2="1200" y2="250" stroke="#ff3b21" stroke-width="1" style="animation-delay:-6s"/>
<line class="scan" x1="0" y1="300" x2="1200" y2="300" stroke="#ff3b21" stroke-width="1" style="animation-delay:-1.5s"/>
</g>
<line x1="80" y1="56" x2="1120" y2="56" stroke="#3a3833"/>
<text x="80" y="44" font-family="f2" font-size="13" letter-spacing="2" fill="#9a958a">OPERATOR FILE   /   TLP:CLEAR   /   REV 2026.10</text>
<text x="947.1" y="44" font-family="f2" font-size="13" letter-spacing="2" fill="#9a958a">SAMSUN · TR · UTC+3</text>
<path d="M80 108V92H96" fill="none" stroke="#ff3b21" stroke-width="2"/>
<path d="M1120 76V92H1104" fill="none" stroke="#ff3b21" stroke-width="2"/>
<text x="80" y="188" font-family="f1" font-size="92" fill="#ece8de" letter-spacing="1">EMRE KADIR DAĞDELEN</text>
<text x="82" y="224" font-family="f4" font-size="18" letter-spacing="1" fill="#ff3b21">@dagdelean<animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></text>
<text x="80" y="276" font-family="f3" font-size="21" fill="#cfc9bb">I build for the web — and I am training to break it.</text>
<line x1="80" y1="300" x2="1120" y2="300" stroke="#252421"/>
<text x="80" y="322" font-family="f2" font-size="12" letter-spacing="1.5" fill="#67635a">CLASS  Offensive security, in training        STATUS  shipping · studying · open to work</text>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#3a3833"/>
</svg>